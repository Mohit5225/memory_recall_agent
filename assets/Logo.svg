<svg width="48" height="48" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="nebulaGradient" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#9575CD"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#F1F5F9" flood-opacity="0.1"/>
    </filter>
  </defs>
  <circle cx="24" cy="24" r="20" fill="url(#nebulaGradient)" filter="url(#glow)"/>
  <!-- ...existing logo shapes, use fill="#7C3AED" for main, and highlights as needed... -->
</svg>
